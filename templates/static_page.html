{% extends "base.html" %}
{% set active_nav = '' %}

{% block head %}
<title>{{ page_title }}</title>
<meta name="description" content="{{ page_title }} - Satta King provides fast and accurate Satta King results. Read our {{ page_title|lower }} for complete Satta King website information.">
<meta name="keywords" content="satta king, satta king {{ page_title|lower }}, satta king result, satta king live, satta king chart">
<meta name="robots" content="index, follow">
<link rel="canonical" href="{{ base_url }}/{{ page_title|lower|replace(' ', '-') }}">
<meta property="og:title" content="{{ page_title }}">
<meta property="og:description" content="{{ page_title }} - Satta King website information and policies.">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ base_url }}/{{ page_title|lower|replace(' ', '-') }}">
<meta property="og:site_name" content="Satta King">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ page_title }}">
{% endblock %}

{% block styles %}
<style>
    .main-content {
        padding: 30px 0;
    }
    
    @media (max-width: 768px) {
        .main-content { padding: 20px 0; }
    }
    
    .page-container {
        background: #fff;
        border-radius: 15px;
        padding: 35px 40px;
        box-shadow: 0 4px 20px rgba(0,0,0,0.08);
    }
    
    @media (max-width: 768px) {
        .page-container { padding: 25px 20px; }
    }
    
    .page-title {
        font-size: 28px;
        font-weight: 700;
        color: #333;
        margin-bottom: 25px;
        padding-bottom: 15px;
        border-bottom: 3px solid #ffd700;
        text-align: center;
    }
    
    .page-content h2 {
        color: #333;
        font-size: 22px;
        margin: 30px 0 15px;
        padding-bottom: 8px;
        border-bottom: 2px solid #eee;
    }
    
    .page-content h3 {
        color: #444;
        font-size: 18px;
        margin: 22px 0 12px;
    }
    
    .page-content p {
        color: #555;
        line-height: 1.9;
        margin-bottom: 16px;
        font-size: 15px;
    }
    
    .page-content ul, .page-content ol {
        color: #555;
        line-height: 2;
        padding-left: 25px;
        margin-bottom: 20px;
    }
    
    .page-content ul li, .page-content ol li {
        margin-bottom: 10px;
    }
    
    .page-content strong {
        color: #333;
    }
    
    .info-box {
        background: #f8f9fa;
        padding: 20px 25px;
        border-radius: 10px;
        margin: 20px 0;
        border-left: 4px solid #667eea;
    }
    
    .warning-box {
        background: #fff3cd;
        padding: 18px 22px;
        border-radius: 10px;
        border-left: 4px solid #ffc107;
        margin: 20px 0;
    }
    
    .warning-box p {
        margin: 0;
        color: #856404;
    }
</style>
{% endblock %}

{% block content %}
<div class="page-wrapper">
    <div class="main-content">
        <div class="page-container">
            <h1 class="page-title">{{ page_title }}</h1>
            <div class="page-content">
                {{ page_content|safe }}
            </div>
        </div>
    </div>
</div>
{% endblock %}
